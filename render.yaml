services:
  - type: web
    name: sk-chat
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: sk_connect
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: SK_CENTRAL_SSO_SECRET
        sync: false
      - key: SK_CENTRAL_API_URL
        value: https://www.sk-hub.in/api
      - key: SK_CENTRAL_SERVICE_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: TURN_URLS
        sync: false
      - key: TURN_SHARED_SECRET
        sync: false
      - key: TURN_CREDENTIAL_TTL_SECONDS
        value: 3600
      - key: UPLOAD_DAILY_QUOTA_MB
        value: 250
      - key: UPLOAD_DAILY_FILE_LIMIT
        value: 100
      - key: MALWARE_SCAN_REQUIRED
        value: false
      - key: MALWARE_SCAN_URL
        sync: false
      - key: MALWARE_SCAN_TOKEN
        sync: false
